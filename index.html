<script>
const D=[{"n":"Babi Na Farko","t":"Muƙaddima","a":"الْمُقَدِّمَةُ","s":[{"t":"Gabatarwa","a":"","b":[{"k":"p","x":"<b>بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ<\/b>"},{"k":"p","x":"Dukkan yabo da godiya sun tabbata ga Allah Maɗaukakin Sarki,"},{"k":"p","x":"<i>“<b>Lallai<\/b> Mu, <b>Mun saukar<\/b> da <b>shi<\/b> a <b>matsayin Alƙur’ani na Larabci<\/b>, <b>domin ku hankalta<\/b>.”<b><\/i> — Suratul Yusuf: 2<\/b>"},{"k":"p","x":"Tsira da amincin Allah su tabbata ga fiyayyen halitta, Annabin Rahama, Annabi Muhammad (SAW), da iyalansa, da sahabbansa, da duk wanda ya bi tafarkinsu har zuwa ranar sakamako."},{"k":"p","x":"<b>أَمَّا بَعْدُ:<\/b>"},{"k":"p","x":"Bayan haka, ’yan uwa..."},{"k":"p","x":"Kasancewar ganin yadda ’yan uwana ɗalibai suke sha’awar koyon harshen Larabci, ta yadda za su iya fara magana da yaren Larabci cikin sauƙi, hakan ya sanya ni ƙoƙarin rubuta wannan ƙaramin littafi, domin ya kasance matafiyi da abokin tafiya ga kowane ɗalibi mai farawa - yaro ko babba."},{"k":"p","x":"Ba na so littafin ya kasance mai wahala ba. Na so ya kasance mai sauƙi, mai daɗi, wanda ɗalibi zai karanta ya fahimta, ya kuma iya yin magana da kansa."},{"k":"p","x":"Allah ya sanya shi ya zama alheri da amfanin gaske."}]},{"t":"Shawarwari Ga Ɗalibin Neman Ilmin Larabci","a":"","b":[{"k":"p","x":"Ya kai ɗan uwana mai neman ilmin Larabci, idan kana son ka yi nasara, ga shawarwari guda 5 da ka kamata ka riƙe:"},{"k":"h","x":"1. Ka sa Niyya a ranka da Buri"},{"k":"p","x":"Dole ne ka kasance ka sa niyya a ranka da buri, kuma ka ga a ranka cewa ka sami nasarar koyon Larabci. Wanda ya sa niyya da gaske, Allah yana taimaka masa."},{"k":"h","x":"2. Ka dage da Himma da Ƙoƙari"},{"k":"p","x":"Sai ka dage da himma da ƙoƙari. Ka yita ƙoƙarin bincike da gwadawa. Kada ka ji kunya wajen tambaya. Tambaya ita ce makullin ilimi."},{"k":"h","x":"3. Ka kasance Mai Haƙuri da Juriya"},{"k":"p","x":"Sai ka kasance mai haƙuri da juriya. Koyon harshe ba na rana ɗaya ba ne. Kaɗan-kaɗan ne ake hawa. Yau kalma ɗaya, gobe kalma biyu, nan gaba ka ga ka iya magana."},{"k":"h","x":"4. Ka sami Malamin da zai riƙa koya maka"},{"k":"p","x":"Sai ka sami malamin da zai riƙa koya maka darasin Larabci. Yana karanta maka, yana fassara maka, kana bibiya, kana riƙewa. Ko da ace a kullum za ka ƙaru da kalma 2 ne, to wannan nasara ce. Kar ka raina ƙaramin ƙari."},{"k":"h","x":"5. Ka rinƙa Gwada Muhadasa"},{"k":"p","x":"Sai kana gwadawa - kana gwada yin magana da wani da yaren Larabci. Duk abin da ka karanta, ka rinƙa gwada shi a magana. Kada ka bar Larabci a littafi kaɗai, ka fitar da shi a bakinka."},{"k":"p","x":"<b>Insha Allah, idan ka bi waɗannan shawarwari, za ka ga kanka kana magana da Larabci cikin sauƙi ba da jimawa ba.<\/b>"}]},{"t":"Muhimmancin Koyon Larabci","a":"","b":[{"k":"p","x":"Ka sani, ya kai ɗan uwana, yaren Larabci ya kasance shi ne mafi girman dukkan wani harshe a duniya. Kuma harshe ne mafi daɗin saurara."},{"k":"p","x":"<b>Daga cikin falalarsa:<\/b>"},{"k":"h","x":"1. Alƙur’ani da Larabci aka saukar da shi"},{"k":"p","x":"Allah Maɗaukakin Sarki ya ce: “Inna anzalnahu Qur’anan Arabiyyan...” - Da Larabci aka saukar da Alƙur’ani. Wanda ya koyi Larabci, ya kusa fahimtar maganar Allah da kansa."},{"k":"h","x":"2. Annabin mu Annabi Muhammad (SAW) balarabe ne, da Larabci yake magana"},{"k":"p","x":"Dukkan Hadisansa, dukkan karantarwarsa, da Larabci ne. Idan ka koyi Larabci, ka koyi harshen Manzon Allah (SAW)."},{"k":"h","x":"3. Dukkan littattafan Addini, Hadisai da duk wani ilmi, da Larabci aka rubuta su"},{"k":"p","x":"Fiqhu, Tafsiri, Nahwu, Sarfu, Tarihi - duk da Larabci aka rubuta su."},{"k":"p","x":"<b>Kenan, idan ka koyi yaren Larabci, ka sami makullin buɗe ko wane ilmi.<\/b>"}]}]},{"n":"Babi Na Biyu","t":"Sunayen Abubuwa","a":"أَسْمَاءُ الْأَشْيَاءِ","s":[{"t":"Wurare","a":"الْأَمَاكِنُ","b":[{"k":"t","rows":[{"h":"Makaranta","a":"الْمَدْرَسَةُ"},{"h":"Gida","a":"الْبَيْتُ"},{"h":"Masallaci","a":"الْمَسْجِدُ"},{"h":"Kasuwa","a":"السُّوقُ"},{"h":"Asibiti","a":"الْمُس َأُ عَمَلِي فِي الثَّامِنَةِ"},{"h":"<b>Yaushe aikinka yake ƙarewa?<\/b>","a":"مَتَى يَنْتَهِي عَمَلُكَ؟","q":1},{"h":"Aikina yana ƙarewa karfe uku","a":"يَنْتَهِي عَمَلِي فِي الثَّالِثَةِ"},{"h":"<b>Shin kana son aikinka?<\/b>","a":"هَلْ تُحِبُّ عَمَلَكَ؟","q":1},{"h":"Eh, ina son aikina sosai","a":"نَعَمْ، أُحِبُّ عَمَلِي كَثِيرًا"},{"h":"<b>Shin aikinka yana da wahala?<\/b>","a":"هَلْ عَمَلُكَ صَعْبٌ؟","q":1},{"h":"Wani lokaci yana da wahala","a":"أَحْيَانًا يَكُونُ صَعْبًا"},{"h":"<b>Awa nawa kake aiki a rana?<\/b>","a":"كَمْ سَاعَةً تَعْمَلُ فِي الْيَوْمِ؟","q":1},{"h":"Ina aiki awa shida","a":"أَعْمَلُ سِتَّ سَاعَاتٍ"},{"h":"<b>Wane ne shugabanka a wurin aiki?<\/b>","a":"مَنْ مُدِيرُكَ؟","q":1},{"h":"Shugabana mutum ne mai karamci","a":"مُدِيرِي رَجُلٌ كَرِيمٌ"},{"h":"<b>Shin ɗan’uwanka yana aiki?<\/b>","a":"هَلْ أَخُوكَ يَعْمَلُ؟","q":1},{"h":"Eh, shi likita ne","a":"نَعَمْ، هُوَ طَبِيبٌ"},{"h":"<b>Me mahaifinka yake yi?<\/b>","a":"مَاذَا يَعْمَلُ أَبُوكَ؟","q":1},{"h":"Mahaifina manomi ne","a":"أَبِي مُزَارِعٌ"},{"h":"<b>Shin mahaifiyarka tana aiki?<\/b>","a":"هَلْ أُمُّكَ تَعْمَلُ؟","q":1},{"h":"Eh, mahaifiyata tela ce","a":"نَعَمْ، أُمِّي خَيَّاطَةٌ"},{"h":"<b>Shin kana so ka zama injiniya?<\/b>","a":"هَلْ تُرِيدُ أَنْ تَكُونَ مُهَنْدِسًا؟","q":1},{"h":"A’a, ina so in zama liman","a":"لَا، أُرِيدُ أَنْ أَكُونَ إِمَامًا"},{"h":"<b>Shin kana samun hutun aiki?<\/b>","a":"هَلْ تَأْخُذُ إِجَازَةً؟","q":1},{"h":"Eh, ina hutu ranar Juma’a","a":"نَعَمْ، آخُذُ إِجَازَةً يَوْمَ الْجُمُعَةِ"},{"h":"<b>Shin kana da aiki yau?<\/b>","a":"هَلْ أَنْتَ مَشْغُولٌ الْيَوْمَ؟","q":1},{"h":"Eh, ina da aiki da yawa","a":"نَعَمْ، عِنْدِي عَمَلٌ كَثِيرٌ"},{"h":"<b>Allah ya ba ka nasara a aikinka<\/b>","a":"وَفَّقَكَ اللَّهُ فِي عَمَلِكَ"},{"h":"Amin, Allah ya yi albarka","a":"آمِينَ، بَارَكَ اللَّهُ فِيكَ"}]}]},{"t":"Sallah Da Ibada","a":"الصَّلَاةُ وَالْعِبَادَةُ","b":[{"k":"t","rows":[{"h":"<b>Shin ka yi sallar Asuba?<\/b>","a":"هَلْ صَلَّيْتَ الْفَجْرَ؟","q":1},{"h":"Eh, na yi ta a masallaci","a":"نَعَمْ، صَلَّيْتُهُ فِي الْمَسْجِدِ"},{"h":"<b>Salloli nawa ake yi a rana?<\/b>","a":"كَمْ صَلَاةً فِي الْيَوْمِ؟","q":1},{"h":"Salloli biyar a rana","a":"خَمْسُ صَلَوَاتٍ فِي الْيَوْمِ"},{"h":"<b>Shin ka yi alwala?<\/b>","a":"هَلْ تَوَضَّأْتَ؟","q":1},{"h":"Eh, na yi alwala ɗazu","a":"نَعَمْ، تَوَضَّأْتُ قَبْلَ قَلِيلٍ"},{"h":"<b>Ina alƙibla?<\/b>","a":"أَيْنَ الْقِبْلَةُ؟","q":1},{"h":"Alƙibla tana wannan gefen","a":"الْقِبْلَةُ مِنْ هَذِهِ الْجِهَةِ"},{"h":"<b>Wa yake jagorantar masu sallah?<\/b>","a":"مَنْ يَؤُمُّ الْمُصَلِّينَ؟","q":1},{"h":"Liman ne yake jagorantar su","a":"الْإِمَامُ يَؤُمُّهُمْ"},{"h":"<b>Yaushe mai kiran sallah yake kira?<\/b>","a":"مَتَى يُؤَذِّنُ الْمُؤَذِّنُ؟","q":1},{"h":"Yana kira idan lokaci ya yi","a":"يُؤَذِّنُ عِنْدَ دُخُولِ الْوَقْتِ"},{"h":"<b>Shin kana karanta Alƙur’ani?<\/b>","a":"هَلْ تَقْرَأُ الْقُرْآنَ؟","q":1},{"h":"Eh, ina karanta shafi ɗaya kowace rana","a":"نَعَمْ، أَقْرَأُ صَفْحَةً كُلَّ يَوْمٍ"},{"h":"<b>Shin kana haddace Alƙur’ani?<\/b>","a":"هَلْ تَحْفَظُ الْقُرْآنَ؟","q":1},{"h":"Ina haddace wasu sura","a":"أَحْفَظُ بَعْضَ السُّوَرِ"},{"h":"<b>Shin kana azumin Ramadan?<\/b>","a":"هَلْ تَصُومُ رَمَضَانَ؟","q":1},{"h":"Eh, ina azumin Ramadan kowace shekara","a":"نَعَمْ، أَصُومُ رَمَضَانَ كُلَّ سَنَةٍ"},{"h":"<b>Yaushe mai azumi yake buɗe baki?<\/b>","a":"مَتَى يُفْطِرُ الصَّائِمُ؟","q":1},{"h":"Yana buɗe baki lokacin faɗuwar rana","a":"يُفْطِرُ عِنْدَ غُرُوبِ الشَّمْسِ"},{"h":"<b>Shin kana yin sadaka?<\/b>","a":"هَلْ تَتَصَدَّقُ؟","q":1},{"h":"Eh, ina sadaka kowace Juma’a","a":"نَعَمْ، أَتَصَدَّقُ كُلَّ جُمُعَةٍ"},{"h":"<b>Me kake faɗa a cikin addu’a?<\/b>","a":"مَاذَا تَقُولُ فِي الدُّعَاءِ؟","q":1},{"h":"Ya Ubangijinmu, ka ba mu alheri a duniya da lahira","a":"رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً"},{"h":"<b>Shin ka je sallar Juma’a?<\/b>","a":"هَلْ ذَهَبْتَ إِلَى صَلَاةِ الْجُمُعَةِ؟","q":1},{"h":"Eh, na je tare da mahaifina","a":"نَعَمْ، ذَهَبْتُ مَعَ أَبِي"},{"h":"<b>Shin kana son watan Ramadan?<\/b>","a":"هَلْ تُحِبُّ شَهْرَ رَمَضَانَ؟","q":1},{"h":"Eh, wata ne mai albarka","a":"نَعَمْ، هُوَ شَهْرٌ مُبَارَكٌ"},{"h":"<b>Allah ya karɓi namu da naku<\/b>","a":"تَقَبَّلَ اللَّهُ مِنَّا وَمِنْكَ"},{"h":"Amin, ya Ubangijin talikai","a":"آمِينَ يَا رَبَّ الْعَالَمِينَ"}]}]},{"t":"Tafiya Da Mota Da Jirgi","a":"السَّفَرُ بِالسَّيَّارَةِ وَالطَّائِرَةِ","b":[{"k":"t","rows":[{"h":"<b>Ina tashar jirgin ƙasa?<\/b>","a":"أَيْنَ مَحَطَّةُ الْقِطَارِ؟","q":1},{"h":"Tashar tana da ɗan nisa","a":"الْمَحَطَّةُ بَعِيدَةٌ قَلِيلًا"},{"h":"<b>Tafiyar tana ɗaukar tsawon lokaci nawa?<\/b>","a":"كَمْ تَسْتَغْرِقُ الرِّحْلَةُ؟","q":1},{"h":"Tana ɗaukar awa biyar","a":"تَسْتَغْرِقُ خَمْسَ سَاعَاتٍ"},{"h":"<b>Shin ka yi ajiyar tikiti?<\/b>","a":"هَلْ حَجَزْتَ التَّذْكِرَةَ؟","q":1},{"h":"Eh, na yi ajiya jiya","a":"نَعَمْ، حَجَزْتُهَا أَمْسِ"},{"h":"<b>Yaushe jirgin sama zai tashi?<\/b>","a":"مَتَى تُقْلِعُ الطَّائِرَةُ؟","q":1},{"h":"Jirgin zai tashi da safe","a":"تُقْلِعُ الطَّائِرَةُ فِي الصَّبَاحِ"},{"h":"<b>Shin kana da jaka babba?<\/b>","a":"هَلْ مَعَكَ حَقِيبَةٌ كَبِيرَةٌ؟","q":1},{"h":"Eh, ina da jakunkuna biyu","a":"نَعَمْ، مَعِي حَقِيبَتَانِ"},{"h":"<b>Ina wurin zamanka?<\/b>","a":"أَيْنَ مَقْعَدُكَ؟","q":1},{"h":"Wurin zamana yana kusa da taga","a":"مَقْعَدِي بِجَانِبِ النَّافِذَةِ"},{"h":"<b>Shin hanyar tana da tsawo?<\/b>","a":"هَلِ الطَّرِيقُ طَوِيلٌ؟","q":1},{"h":"Eh, hanyar tana da tsawo","a":"نَعَمْ، الطَّرِيقُ طَوِيلٌ"},{"h":"<b>Shin direban ƙwararre ne?<\/b>","a":"هَلِ السَّائِقُ مَاهِرٌ؟","q":1},{"h":"Eh, direba ne ƙwararre","a":"نَعَمْ، هُوَ سَائِقٌ مَاهِرٌ"},{"h":"<b>Shin muna buƙatar fetur?<\/b>","a":"هَلْ نَحْتَاجُ إِلَى بَنْزِينٍ؟","q":1},{"h":"Eh, za mu tsaya a gidan mai","a":"نَعَمْ، سَنَقِفُ عِنْدَ مَحَطَّةِ الْوُقُودِ"},{"h":"<b>Shin kana da fasfo?<\/b>","a":"هَلْ عِنْدَكَ جَوَازُ سَفَرٍ؟","q":1},{"h":"Eh, fasfona yana tare da ni","a":"نَعَمْ، جَوَازُ سَفَرِي مَعِي"},{"h":"<b>Shin mun isa?<\/b>","a":"هَلْ وَصَلْنَا؟","q":1},{"h":"A’a, saura kaɗan","a":"لَا، بَقِيَ الْقَلِيلُ"},{"h":"<b>Ina otal ɗin?<\/b>","a":"أَيْنَ الْفُنْدُقُ؟","q":1},{"h":"Otal ɗin yana kusa da filin jirgi","a":"الْفُنْدُقُ قُرْبَ الْمَطَارِ"},{"h":"<b>Dare nawa za ka kwana?<\/b>","a":"كَمْ لَيْلَةً سَتَبْقَى؟","q":1},{"h":"Zan kwana dare uku","a":"سَأَبْقَى ثَلَاثَ لَيَالٍ"},{"h":"<b>Shin tafiyar tana da daɗi?<\/b>","a":"هَلِ الرِّحْلَةُ مُرِيحَةٌ؟","q":1},{"h":"Eh, tafiyar tana da daɗi","a":"نَعَمْ، الرِّحْلَةُ مُرِيحَةٌ"},{"h":"<b>Tafiya mai daɗi<\/b>","a":"رِحْلَةٌ سَعِيدَةٌ"},{"h":"Na gode, Allah ya tsare ka","a":"شُكْرًا، اللَّهُ يُسَلِّمُكَ"}]}]},{"t":"Banki Da Kuɗi","a":"الْبَنْكُ وَالْمَالُ","b":[{"k":"t","rows":[{"h":"<b>Ina banki?<\/b>","a":"أَيْنَ الْبَنْكُ؟","q":1},{"h":"Banki yana ƙarshen titi","a":"الْبَنْكُ فِي آخِرِ الشَّارِعِ"},{"h":"<b>Shin kana da asusu a banki?<\/b>","a":"هَلْ عِنْدَكَ حِسَابٌ فِي الْبَنْكِ؟","q":1},{"h":"Eh, ina da asusu","a":"نَعَمْ، عِنْدِي حِسَابٌ"},{"h":"<b>Nawa kake son cirewa?<\/b>","a":"كَمْ تُرِيدُ أَنْ تَسْحَبَ؟","q":1},{"h":"Ina son cire naira dubu goma","a":"أُرِيدُ أَنْ أَسْحَبَ عَشَرَةَ آلَافِ نَايْرَا"},{"h":"<b>Shin ka adana kuɗi?<\/b>","a":"هَلِ ادَّخَرْتَ مَالًا؟","q":1},{"h":"Eh, ina ajiyar kaɗan kowane wata","a":"نَعَمْ، أَدَّخِرُ قَلِيلًا كُلَّ شَهْرٍ"},{"h":"<b>Nawa ne albashinka?<\/b>","a":"كَمْ رَاتِبُكَ؟","q":1},{"h":"Albashina ya wadatar, godiya ga Allah","a":"رَاتِبِي مُنَاسِبٌ وَالْحَمْدُ لِلَّهِ"},{"h":"<b>Shin kana da bashi?<\/b>","a":"هَلْ عَلَيْكَ دَيْنٌ؟","q":1},{"h":"A’a, ba ni da bashi","a":"لَا، لَيْسَ عَلَيَّ دَيْنٌ"},{"h":"<b>Shin kana ba abokinka rance?<\/b>","a":"هَلْ تُقْرِضُ صَدِيقَكَ؟","q":1},{"h":"Eh, ina ba shi rance idan ya buƙata","a":"نَعَمْ، أُقْرِضُهُ إِنِ احْتَاجَ"},{"h":"<b>Yaushe za ka mayar da kuɗin?<\/b>","a":"مَتَى تَرُدُّ الْمَالَ؟","q":1},{"h":"Zan mayar da shi mako mai zuwa","a":"أَرُدُّهُ الْأُسْبُوعَ الْقَادِمَ"},{"h":"<b>Shin kuɗin sun ishe ka?<\/b>","a":"هَلِ الْمَالُ كَافٍ؟","q":1},{"h":"Eh, kuɗin sun isa","a":"نَعَمْ، الْمَالُ كَافٍ"},{"h":"<b>Shin wannan farashin ya dace?<\/b>","a":"هَلْ هَذَا السِّعْرُ مُنَاسِبٌ؟","q":1},{"h":"A’a, wannan farashin ya yi tsada","a":"لَا، هَذَا السِّعْرُ مُرْتَفِعٌ"},{"h":"<b>Shin za ka rage farashin?<\/b>","a":"هَلْ تُخَفِّضُ السِّعْرَ؟","q":1},{"h":"Eh, zan rage kaɗan","a":"نَعَمْ، أُخَفِّضُهُ قَلِيلًا"},{"h":"<b>Shin kuna karɓar biyan kati?<\/b>","a":"هَلْ تَقْبَلُونَ الدَّفْعَ بِالْبِطَاقَةِ؟","q":1},{"h":"A’a, kuɗi kaɗai muke karɓa","a":"لَا، نَقْبَلُ النُّقُودَ فَقَطْ"},{"h":"<b>Ina zan biya?<\/b>","a":"أَيْنَ أَدْفَعُ؟","q":1},{"h":"Ka biya a wurin karɓar kuɗi","a":"ادْفَعْ عِنْدَ الصُّنْدُوقِ"},{"h":"<b>Shin ka karɓi sauran kuɗi?<\/b>","a":"هَلْ أَخَذْتَ الْبَاقِيَ؟","q":1},{"h":"Eh, na gode","a":"نَعَمْ، شُكْرًا"},{"h":"<b>Mene ne mafi kyau a yi da kuɗi?<\/b>","a":"مَا أَفْضَلُ مَا تَفْعَلُ بِالْمَالِ؟","q":1},{"h":"Ina sadaka kuma in ajiye wani sashi","a":"أَتَصَدَّقُ وَأَدَّخِرُ بَعْضَهُ"}]}]},{"t":"Larabci Da Karatu","a":"تَعَلُّمُ اللُّغَةِ الْعَرَبِيَّةِ","b":[{"k":"t","rows":[{"h":"<b>Tun yaushe kake koyon Larabci?<\/b>","a":"مُنْذُ مَتَى تَتَعَلَّمُ الْعَرَبِيَّةَ؟","q":1},{"h":"Tun shekara ɗaya","a":"مُنْذُ سَنَةٍ"},{"h":"<b>Shin Larabci yana da wahala?<\/b>","a":"هَلِ الْعَرَبِيَّةُ صَعْبَةٌ؟","q":1},{"h":"Ba shi da wahala idan ka yi ƙoƙari","a":"لَيْسَتْ صَعْبَةً إِذَا اجْتَهَدْتَ"},{"h":"<b>Kalmomi nawa kake haddacewa kowace rana?<\/b>","a":"كَمْ كَلِمَةً تَحْفَظُ كُلَّ يَوْمٍ؟","q":1},{"h":"Ina haddace kalmomi biyar","a":"أَحْفَظُ خَمْسَ كَلِمَاتٍ"},{"h":"<b>Shin kana rubutu da Larabci?<\/b>","a":"هَلْ تَكْتُبُ بِالْعَرَبِيَّةِ؟","q":1},{"h":"Eh, ina rubuta gajerun jumloli","a":"نَعَمْ، أَكْتُبُ جُمَلًا قَصِيرَةً"},{"h":"<b>Shin kana fahimtar maganar malami?<\/b>","a":"هَلْ تَفْهَمُ كَلَامَ الْأُسْتَاذِ؟","q":1},{"h":"Eh, ina fahimtarsa sosai","a":"نَعَمْ، أَفْهَمُهُ جَيِّدًا"},{"h":"<b>Shin kana magana da abokan karatunka da Larabci?<\/b>","a":"هَلْ تَتَكَلَّمُ مَعَ زُمَلَائِكَ بِالْعَرَبِيَّةِ؟","q":1},{"h":"Eh, muna e?","a":"سَعِيدٌ : أَكِتَابُ مُحَمَّدٍ هَذَا يَا يَاسِرُ ؟","j":"<i>Saidu: A kitabul Muhammadu hazaa ya Yaasir?<\/i>"},{"h":"Yasir: A'a, wannan littafin Hamid ne.","a":"يَاسِرٌ : لَا, هَذَا كِتَابُ حَامِدٍ.","j":"<i>Yaasir: Laa, hazaa kitabu Haamidii<\/i>"},{"h":"Saidu: Ina littafin Muhammad yake?","a":"سَعِيدٌ : أَيْنَ كِتَابُ مُحَمَّدٍ ؟","j":"<i>Saidu: aina kitabul Muhammadu?<\/i>"},{"h":"Yasir: Yana kan tebur din can.","a":"يَاسِرٌ : هُوَ عَلَى المَكْتَبِ هُنَاكَ.","j":"<i>Yaasir: Huwa ala maktabi honaka.<\/i>"},{"h":"Saidu: Ina littafin rubutun Ammar yake?","a":"سَعِيدٌ : أَيْنَ دَفْتَرُ عَمَّارٍ ؟","j":"<i>Saidu: Ina daftarul Ammari?<\/i>"},{"h":"Yasir: Yana saman teburin malam.","a":"يَاسِرٌ : هُوَ عَلَى مَكْتَبِ المُدَرِّسِ.","j":"<i>Yaasir: Huwa ala maktabil mudarrisi.<\/i>"},{"h":"Saidu: alkalamin Wane ne wannan ya Ali?","a":"سَعِيدٌ : قَلَمُ مَنْ هَذَا يَا عَلِيُّ ؟","j":"<i>Saidu: Kalamu wane hazaa ya Aliyu?<\/i>"},{"h":"Ali: Wannan alkalamin malam ne.","a":"عَلِيٌّ : هَذَا قَلَمُ المُدَرِّسِ.","j":"<i>Aliyu: Hazaa kalamul mudarrisi.<\/i>"},{"h":"Saidu: Ina jakar malamin take?","a":"سَعِيدٌ : أَيْنَ حَقِيبَةُ المُدَرِّسِ ؟","j":"<i>Saidu: aina hakibatun mudarrisi?<\/i>"},{"h":"Ali: Tana karkashin tebur.","a":"عَلِيٌّ : هِيَ تَحْتَ المَكْتَبِ.","j":"<i>Aliyu: Hiya tahatal maktabi.<\/i>"}]}]},{"t":"Darasi na 6","a":"الدَّرْسُ السَّادِسُ","b":[{"k":"t","rows":[{"h":"Wannan dan Hamidu ne wannar kuma 'yar Yasir ce.","a":"هَذَا ابْنُ حَامِدٍ وَهَذِهِ بِنْتُ يَاسِرٍ."},{"h":"Dan Hamidu yana zaune 'yar Yasir kuma tana tsaye.","a":"ابْنُ حَامِدٍ جَالِسٌ وَبِنْتُ يَاسِرٍ وَاقِفَةٌ."},{"h":"Wace ce wannar?","a":"مَنْ هَذِهِ؟"},{"h":"Wannan yar'uwar Injiniya ce.","a":"هَذِهِ أُخْتُ المُهَنْدِسِ."},{"h":"Shin ita ma Injiniya ce?","a":"أَهِيَ أَيْضًا مُهَنْدِسَةٌ؟"},{"h":"A'a, ita likita ce.","a":"لَا، هِيَ طَبِيبَةٌ."},{"h":"motar waye wannan ?","a":"سَيَّارَةُ مَنْ هَذِهِ؟"},{"h":"Wannan motar principal/ Shugaban Makaranta ce.","a":"هَذِهِ سَيَّارَةُ المُدِيرِ."},{"h":"Menene wannan?","a":"مَا هَذِهِ؟"},{"h":"Wannan dutsen guga ne.","a":"هَذِهِ مِكْوَاةٌ."},{"h":"Nawaye ce wannan?","a":"لمَنْ هَذِهِ؟"},{"h":"Wannan na Khalid ne.","a":"هَذِهِ لخَالِدٌ."},{"h":"Shin wannan keken Anas ne?","a":"أَدَرَّاجَةُ أَنَسٍ هَذِهِ؟"},{"h":"A'a. Wannan keken Ammar ne. Wannan sabuwa ce, kuma keken Anas tsohuwa ce.","a":"لَا. هَذِهِ دَرَّاجَةُ عَمَّارٍ. هَذِهِ جَدِيدَةٌ، وَدَرَّاجَةُ أَنَسٍ قَدِيمَةٌ."},{"h":"Wannan agogon Ali ne. Yayi kyau sosai.","a":"هَذِهِ سَاعَةُ عَلِيٍّ. هِيَ جَمِيلَةٌ جِدًّا."},{"h":"Wannan cokali ne kuma wannan tukunya ce. Cokalin yana cikin tukunya.","a":"هَذِهِ مِلْعَقَةٌ وَهَذَا قِدْرٌ. المِلْعَقَةُ فِي القِدْرِ."},{"h":"Wannan saniyar manomi ce.","a":"هَذِهِ بَقَرَةُ الفَلَّاحِ."},{"h":"Wannan hanci ne wannan kuma baki ne.","a":"هَذَا أَنْفٌ وَهَذَا فَمٌ."},{"h":"Wannan kunne ne wannan kuma ido ne.","a":"هَذِهِ أُذُنٌ وَهَذِهِ عَيْنٌ."},{"h":"Wannan hannu ne wannan kuma ƙafa ce.","a":"هَذِهِ يَدٌ وَهَذِهِ رِجْلٌ."}]}]},{"t":"Darasi na 7","a":"الدَّرْسُ الخَامِسُ","b":[{"k":"t","rows":[{"h":"Zainab: Ina yar uwar ki take ya Amina?","a":"زَيْنَبُ: أَيْنَ أُخْتُكِ يَا آمِنَةُ ؟"},{"h":"Amina: Yar uwata tana biye muraja,an karanta darasinta.","a":"آمِنَةُ: أُخْتِي تُطَالِعُ دَرْسَهَا."},{"h":"Zainab: Ina mahaifiyar ki take ?","a":"زَيْنَبُ: أَيْنَ أُمُّكِ ؟"},{"h":"Amina: mahaifiyata tana goge tufafinmu da dutsen guga","a":"آمِنَةُ: أُمِّي تَكْوِي مَلَابِسَنَا بِالمِكْوَاةِ."},{"h":"Zainab: Ina yafendon ki yar,uwar mahaifiyar ki?","a":"زَيْنَبُ: أَيْنَ خَالَتُكِ ؟"},{"h":"Amina: yar,uwar mahaifiya ta tana tafasa ruwa a tukunya.","a":"آمِنَةُ: خَالَتِي تَغْلِي مَاءً فِي القِدْرِ."},{"h":"Zainab: Ina goggon ki/ yar,uwar mahaifiyar ki?","a":"زَيْنَبُ: أَيْنَ عَمَّتُكِ ؟"},{"h":"Amina: goggo na tana dinke rigar yar uwata.","a":"آمِنَةُ: عَمَّتِي تَخِيطُ فُسْتَانَ أُخْتِي."},{"h":"Zainab: Ina kakarki?","a":"زَيْنَبُ: أَيْنَ جَدَّتُكِ ؟"},{"h":"Amina: Kakar ta tana wasa wuka.","a":"آمِنَةُ: جَدَّتِي تَسُنُّ سِكِّينًا."},{"h":"Zainab: Me yasa take kaifa wuka da masashi?","a":"زَيْنَبُ: لِمَاذَا تَسُنُّ السِّكِّينَ بِالمِسَنِّ ؟"},{"h":"Amina: Domin ta yanka 'ya'yan itace/kayan marmari da shi.","a":"آمِنَةُ: لِتُقَشِّرَ بِهِ الفَاكِهَةَ."},{"h":"Zainab: Wa ya sayi 'ya'yan itacen?","a":"زَيْنَبُ: مَنْ اشْتَرَى الفَاكِهَةَ ؟"},{"h":"Amina: Mahaifina ya sayesu da safe.","a":"آمِنَةُ: اشْتَرَاهَا أَبِي فِي الصَّبَاحِ."}]}]},{"t":"Darasi na 8","a":"الدَّرْسُ السَّابِعُ","b":[{"k":"t","rows":[{"h":"Wace ce wannan?","a":"مَنْ هَذِهِ؟"},{"h":"Wannan Aminatu ce","a":"هَذِهِ آمِنَةُ."},{"h":"Wace ce waccar?","a":"مَنْ تِلْكَ؟"},{"h":"Wannan likita ce, waccar kuma marar lafiya ce","a":"هَذِهِ طَبيبةُ وَتِلْكَ مُمرْضِةٌ."},{"h":"Wannan daga kasar indiya take waccan 'kuma daga kasar Japan taje","a":"هَذِهِ مِنَ الْهِنْدِ وَتِلْكَ مِنَ الْيَابَانِ."},{"h":"Wannan doguwa ce, waccan kuma gajeriya ce.","a":"هَذِهِ طَوِيلَةٌ وَتِلْكَ قَصِيرَةٌ."},{"h":"Waye wannan?","a":"مَنْ هَذَا؟"},{"h":"Wannan Hamidu ne","a":"هَذَا حَامِدٌ."},{"h":"wayne ne wancan?","a":"وَمَنْ ذَلِكَ؟"},{"h":"Wancan Aliyu ne","a":"ذَلِكَ عَلِيٌّ."},{"h":"Shin waccan kaza ce?","a":"أَتِلْكَ دَجَاجَةٌ؟"},{"h":"A'a. Waccan agwagwa ce.","a":"لَا. تِلْكَ بَطَّةٌ."},{"h":"Mene ne waccan?","a":"مَا تِلْكَ؟"},{"h":"Waccan ƙwai ce.","a":"تِلْكَ بَيْضَةٌ."},{"h":"Wannan motar Malami ce, waccar kuma motar Darakta ce.","a":"هَذِهِ سَيَّارَةُ الْمُدَرِّسِ وَتِلْكَ سَيَّارَةُ الْمُدِيرِ."},{"h":"Shin wannan agogon Abbas ne?","a":"أَسَاعَةُ عَبَّاسٍ هَذِهِ؟"},{"h":"A'a. Wannan agogon Hamid ne, waccan agogon Abbas ce.","a":"لَا. هَذِهِ سَاعَةُ حَامِدٍ، تِلْكَ سَاعَةُ عَبَّاسٍ."},{"h":"Waccan zakara ce, kuma waccar kaza ce.","a":"ذَلِكَ دِيكٌ وَتِلْكَ دَجَاجَةٌ."}]},{"k":"h","x":"Kalmomi masu muhimmanci daga darasin:"},{"k":"p","x":"1. هَذِهِ = Wannar - ga abin da yake kusa, na mata"},{"k":"p","x":"2. ذَلِكَ / تِلْكَ = Waccar - ga abin da yake nesa, na/mata"},{"k":"p","x":"3. مَنْ = Waye? / Wace?"},{"k":"p","x":"4. مَا = Mene ne?"},{"k":"p","x":"5. ط function essayOk(tp,e){

  return e.split(/[\/;]|\bko\b/).some(p=>{const x=nH(p);if(!x)return false;if(x===n)return true;if(1-lev(x,n)/Math.max(x.length,n.length)>=.8)return true;const A=tok(n),B=tok(x);return A.reduce((m,w)=>m+Math.max(0,...B.map(v=>tsim(w,v))),0)/Math.max(A.length,B.length)>=.7})
}

const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const nA=s=>s.replace(/[\u064B-\u0652\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[^\u0600-\u06FF\s]/g,' ').replace(/\s+/g,' ').trim();
const nH=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/ɗ/g,'d').replace(/ƙ/g,'k').replace(/ɓ/g,'b').replace(/ƴ/g,'y').replace(/[’'‘`]/g,'').replace(/aa/g,'a').replace(/ii/g,'i').replace(/uu/g,'u').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
const tok=s=>s?s.split(' '):[];
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function tsim(a,b){if(a===b)return 1;const L=Math.max(a.length,b.length);if(L<4)return 0;if(a.length>=4&&b.length>=4&&(a.startsWith(b)||b.startsWith(a))&&Math.abs(a.length-b.length)<=3)return .85;const d=lev(a,b);return d<=(L>=7?2:1)?1-d/L-.05:0}
const STOP=new Set('menene mene me ne ce sunan suna sunansa ma anar anarsa fassarar fassara fassarsa da a cikin larabci larabcin hausa hausan hausar yaya ake cewa ina so in san sani nake kalmar kalma jumlar jumla shine shi wato ko kana ka gaya mini min don malam malamin kuma wanne wani wata abu kira nufi nufin yake ya yi ni na ba fada'.split(' '));
let TX;
function getT(){if(!TX)TX=getIdx().map(r=>({r,ht:tok(nH(r.h)),at:tok(nA(r.a)),jt:tok(nH(r.j))}));return TX}
function sc(q,rt){if(!rt.length||!q.length)return 0;if(q.join(' ')===rt.join(' '))return 1.2;const s=q.reduce((m,w)=>m+Math.max(0,...rt.map(v=>tsim(w,v))),0);return .7*(s/q.length)+.3*Math.min(1,s/rt.length)}
function rank(qt,ar,lim){
  const out=getT().map(x=>({r:x.r,s:ar?sc(qt,x.at):Math.max(sc(qt,x.ht),.95*sc(qt,x.jt))})).filter(x=>x.s>=.35).sort((a,b)=>b.s-a.s),seen=new Set();
  return out.filter(x=>{const k=x.r.h+'|'+x.r.a;if(seen.has(k))return false;seen.add(k);return true}).slice(0,lim||4)
}
const itemH=x=>`<div class="r"><div class="h">${esc(x.r.h)}</div><div class="a" dir="rtl" lang="ar">${esc(x.r.a)}</div><button class="go" data-go="read:${x.r.ci}:${x.r.si}">${D[x.r.ci].t} · ${D[x.r.ci].s[x.r.si].t}</button></div>`;

function trNorm(raw){

  m=s.match(/(?:yaya|ya)\s+ake\s+cewa\s+(.+?)\s+(?:da|a)\s+larabci\??$/i);if(m)return 'Menene larabcin '+m[1];
  m=s.match(/(?:fassara|fassarar)\s+(.+?)\s+(?:zuwa|a|cikin)\s+larabci/i);if(m)return 'Menene larabcin '+m[1];
  m=s.match(/^(.+?)\s+(?:da|a)\s+larabci\??$/i);if(m&&!/^menene/i.test(s)&&m[1].split(' ').length<=4)return 'Menene larabcin '+m[1];

function think2(raw){

  {const ci=cvIntent(raw);if(ci)return cvBegin(ci)}
  raw=trNorm(raw);
  if(/(gwada ni|gwada mu|tambaye ni|mu yi quiz|quiz)/.test(n))return startTq();
  if(/^(assalamu|salam|sannu|barka|ina kwana|ina wuni|ina gajiya|hello|hi)/.test(n)&&n.split(' ').length<=5)return rnd(['Wa alaikumus salam! Barka da zuwa. Me kake so ka koya yau?','Wa alaikumus salam wa rahmatullah! Ina jin ka. Me zan taimaka maka da shi?','Sannu da zuwa! Ka tambaye ni kowace kalma ko jumla ta Larabci.'])+chips(['Gwada ni','Ba ni kalmomin abinci','Me kake iya yi?']);

  if(/^(kuma|ci gaba|kari|ba ni kari|wasu|ba ni misali|misali|ba da misali|karin misali)$/.test(n)&&tctx.more&&tctx.more.length){const nx=tctx.more.splice(0,3);return 'Ga ƙari:'+nx.map(itemH).join('')+chips(tctx.more.length?['Ba ni ƙari','Gwada ni']:['Gwada ni'])}
  const tl=topicList(raw);if(tl)return tl;const ll=lessonList(raw);if(ll)return ll;
  const base=think(raw);
  if(tctx.top>=.9)return base+chips(['Ba ni ƙari','Gwada ni']);
  if(/^(menene|mene ne|me ake nufi|me yake nufi|ya ake|yaya ake|bayyana|bayani|ma ?anar)|bayani|nahawu/.test(n)){const ex=explain(raw);if(ex)return ex}

  if(tctx.top===0){const dm=didYouMean(raw);return 'Na duba littafi, amma ban sami wannan ba. '+(dm.length?'Ko kana nufin ɗaya daga cikin waɗannan?':'Ka gwada rubuta kalmar kaɗai, ko ka sauƙaƙa tambayar. Misali:')+chips(dm.length?dm:['Menene larabcin makaranta?','Ba ni kalmomin abinci','Gwada ni'])}
  return base+chips(['Ba ni ƙari','Gwada ni'])
}

function mlMedia(id,kind,n,mime,onp){
  const key=id+':'+kind;
  if(MP.has(key)){const p=MP.get(key);if(onp)p.cbs.push(onp);return p.p}
  const o={cbs:onp?[onp]:[]};
  o.p=(async()=>{
    try{
      let b=await mget(key);if(b)return b;
      const parts=[];
      for(let k=0;k<n;k++){
        const ck=key+'#'+k;let s=await mget(ck);
        if(!s){const r=await fs('GET','config/lm_'+id+'_'+kind+k,null,true,false,30000);if(r.s!==200)return null;s=r.j.fields.b.stringValue;await mput(ck,s,true)}
        parts.push(s);o.cbs.forEach(f=>{try{f(k+1,n)}catch(e){}})
      }
      b=unb64(parts.join(''),mime);await mput(key,b);
      for(let k=0;k<n;k++)mdel(key+'#'+k);
      return b
    }catch(e){return null}finally{MP.delete(key)}
  })();
  MP.set(key,o);return o.p
}

async function recToggle(){

  let ms;try{ms=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast('Ba a ba da izinin makirufo ba.');return}
  const ty=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(x))||'';
  mchunks=[];let rsz=0;mr=new MediaRecorder(ms,ty?{mimeType:ty,audioBitsPerSecond:32000}:{audioBitsPerSecond:32000});
  mr.ondataavailable=e=>{if(e.data&&e.data.size){mchunks.push(e.data);rsz+=e.data.size;if(rsz>MAXA*.95&&mr.state==='recording')mr.stop()}};
  mr.onstop=async()=>{clearInterval(rt);ms.getTracks().forEach(x=>x.stop());recording=false;await setAud(new Blob(mchunks,{type:mr.mimeType||ty||'audio/webm'}))};
  mr.start(10000);recording=true;lsSync();V.innerHTML=adminView();const t0=Date.now();clearInterval(rt);rt=setInterval(()=>{const b=$('#mlrb');if(b){const q=Math.floor((Date.now()-t0)/1000);b.textContent='⏹️ Tsaya rikodi · '+Math.floor(q/60)+':'+String(q%60).padStart(2,'0')}},1000);
  setTimeout(()=>{if(mr&&mr.state==='recording')mr.stop()},3600000)
}

async function batchW(writes){
  const id=await idt(true);if(!id)return false;const base='projects/'+FB.pid+'/databases/(default)/documents/';
  for(let i=0;i<writes.length;i+=400){
    const chunk=writes.slice(i,i+400).map(w=>w.del?{delete:base+w.del}:{update:{name:base+w.doc,fields:w.fields},...(w.mask?{updateMask:{fieldPaths:w.mask}}:{})});
    const r=await raw('POST',FS+':batchWrite',JSON.stringify({writes:chunk}),'application/json',{Authorization:'Bearer '+id});
    if(r.s!==200||((r.j&&r.j.status)||[]).some(s=>s&&s.code))return false
  }
  return true
}

function makePlan(){
  const g=id=>{const e=document.querySelector('#'+id);return e&&e.value!=null?String(e.value):''};
  rnSort=g('rsort')||'name';
  const m={},rows=[],err=[],taken=new Map(),fixed=new Set(),sel=[];
  [1,2,3,4].forEach(c=>{rnSt[c]=g('rs'+c).trim();const n=parseInt(rnSt[c],10);if(rnSt[c]&&!isNaN(n))sel.push([c,n])});
  if(!sel.length)err.push('Rubuta lambar farawa ta aƙalla aji ɗaya.');
  const sc=new Set(sel.map(x=>x[0]));
  (rnL||[]).filter(s=>!sc.has(+s.cls)).forEach(s=>fixed.add(s.reg));
  sel.forEach(([c,start])=>{
    const L=(rnL||[]).filter(s=>+s.cls===c).sort((a,b)=>rnSort==='name'?(a.name||'').localeCompare(b.name||''):a.reg.localeCompare(b.reg));
    L.forEach((s,i)=>{const num=start+i,nr='LTF'+String(num).padStart(4,'0');
      if(num<1||num>400){err.push(`Aji ${c}: lamba ${num} ta fita daga 1 zuwa 400.`);return}
      if(fixed.has(nr)){err.push(`Lamba ${nr} tana hannun ɗalibin da ba za a canza ajinsa ba.`);return}
      if(taken.has(nr)){err.push(`Lamba ${nr} ajuju biyu za su samu. Ka gyara lambobin farawa.`);return}
      taken.set(nr,s);rows.push({old:s.reg,nr,name:s.name,c});if(nr!==s.reg)m[s.reg]=nr})
  });
  rnPlan={m,rows,err:[...new Set(err)].slice(0,8)}
}

  Object.keys(m).forEach(o=>{if(!targets.has(o))writes.push({doc:'students/'+o,fields:{moved:S(m[o]),name:S((byReg[o]||{}).name||'')}})});

  const o=await cfgMod('regmap','kl_regmap',o=>{o.ops=o.ops||[];rev=o.ops.reduce((a,x)=>Math.max(a,x.rev),0)+1;o.ops.push({rev,t:now,m});o.ops=o.ops.slice(-30);return o});

  await setCfg({regrev:rev});
  const A=st.get('kl_regarch',{}),tmp={};Object.keys(m).forEach(k=>{if(A[k]){tmp[m[k]]={...A[k]};delete A[k]}});st.set('kl_regarch',{...A,...tmp});

  }catch(e){toast('Ba a iya matse sautin ba.')}

}
